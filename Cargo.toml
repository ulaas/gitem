[workspace]
resolver = "3"
members = ["crates/gitem-core", "crates/gitem-text", "crates/gitem"]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/ulaas/gitem"
homepage = "https://ulaas.github.io/gitem/"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# For what gets shipped: a tenth smaller, and about five times as long to build. Not
# `panic = "abort"`, which would save more: a worker thread's panic would then end the app
# rather than fail one view, and tests rely on unwinding.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
