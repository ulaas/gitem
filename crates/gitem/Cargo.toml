[package]
name = "gitem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A fast desktop Git client with a repo-aware editor, its own diff and merge tools, and a commit graph."

[[bin]]
name = "gitem"
path = "src/main.rs"

[dependencies]
gitem-core = { path = "../gitem-core" }
gitem-text = { path = "../gitem-text" }
similar = "3"
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-phosphor = "0.14"
egui_dock = { version = "0.21", features = ["serde"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify = "8"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
ignore = "0.4.33"
memmap2 = "0.9.12"
# Drawing SVG files, with their text. No picture decoding and no compressed SVG: see `svg.rs`.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.21"
# Syntax trees for the editor's outline and folding, behind the `tree-sitter` feature: each
# grammar is C to compile, which not every machine building gitem has.
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }

[features]
default = []
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-go"]

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
gitem-testenv = { path = "../gitem-testenv" }
tempfile = "3"
