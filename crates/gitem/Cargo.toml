[package]
name = "gitem"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gitem"
path = "src/main.rs"

[dependencies]
gitem-core = { path = "../gitem-core" }
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-phosphor = "0.14"
egui_dock = { version = "0.21", features = ["serde"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify = "8"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[dev-dependencies]
egui_kittest = { version = "0.36" }
gitem-testenv = { path = "../gitem-testenv" }
tempfile = "3"
