[package]
name = "gitem-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
regex = "1"
chrono = "0.4"
ureq = { version = "3", features = ["json"] }
directories = "6"
md5 = "0.8"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading"] }

[dev-dependencies]
gitem-testenv = { path = "../gitem-testenv" }
tempfile = "3"
