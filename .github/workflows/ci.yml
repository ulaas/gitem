name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs used to hold the runner for its six-hour limit. This is a good deal
    # more than a full run takes, and its log names the test that was still going.
    timeout-minutes: 90
    env:
      # Each test file is its own binary with the whole UI linked in. With full debug info
      # they filled the Linux runner's disk before the tests ran. Elsewhere line tables stay,
      # so a stuck test's stacks name their functions.
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.os == 'ubuntu-latest' && '0' || 'line-tables-only' }}
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.os == 'ubuntu-latest' && '0' || 'line-tables-only' }}
      # A git command that never ends fails with its name, rather than hanging a test.
      GITEM_GIT_TIMEOUT_SECS: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev
      # Every test binary runs, so one run shows every failure rather than the first file's.
      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked --no-fail-fast
      # The same on Windows, where a test has hung: a stuck binary is dumped, with its symbols,
      # and stopped, rather than holding the runner for hours with nothing to show.
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-hang-watch.ps1
      - name: Upload what a stuck test left
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-dumps
          path: hang-dumps
          if-no-files-found: ignore
          retention-days: 7
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      # The optional tree-sitter build compiles C grammars, so it's checked on every platform
      # rather than assumed to work where the default build does.
      - name: Editor with tree-sitter
        run: cargo test -p gitem --lib --locked --features tree-sitter editor
