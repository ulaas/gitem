# The tests left out of the normal run, because they open windows or take a long time.
# Tests ignored with a bug's ID are not run here: they fail until that bug is fixed.
name: Opt-in tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Real git opening the real windows
        run: cargo test -p gitem --locked --test real_git_windows --test http_auth --test helper_modes -- --ignored --test-threads=1

  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Property tests with many more cases
        run: cargo test -p gitem-core --locked --test properties
        env:
          PROPTEST_CASES: "1000"

  busy-machine:
    # Takes minutes with every core busy, so it runs weekly and on its own.
    if: github.event.schedule == '' || github.run_number % 7 == 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Reads keep their output on a busy machine
        run: cargo test -p gitem-core --locked --test real_git -- --ignored reads_keep_their_output_on_a_busy_machine

  gitea:
    # The hosting client against a real Gitea, which the mock in http_clients.rs can't stand in
    # for. The test only talks to localhost and makes and deletes its own repository.
    runs-on: ubuntu-latest
    services:
      gitea:
        image: gitea/gitea:1
        env:
          GITEA__security__INSTALL_LOCK: "true"
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Wait for Gitea, and make a user with a token
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/healthz > /dev/null && break
            sleep 2
          done
          container="${{ job.services.gitea.id }}"
          docker exec -u git "$container" gitea admin user create --username gitem --password gitem-test-pw --email gitem@example.invalid --must-change-password=false
          token=$(docker exec -u git "$container" gitea admin user generate-access-token --username gitem --scopes all --raw)
          echo "::add-mask::$token"
          echo "GITEM_GITEA_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Gitea contract test
        run: cargo test -p gitem-core --locked --test gitea_contract -- --ignored
        env:
          GITEM_GITEA_URL: http://127.0.0.1:3000
